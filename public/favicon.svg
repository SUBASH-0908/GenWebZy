<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark navy rounded square background -->
  <rect width="64" height="64" rx="14" fill="#0c1120"/>

  <!-- Blue angular "G" bracket — left -->
  <path
    d="M14 18 L10 18 L10 46 L14 46"
    stroke="#2563eb" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"
    fill="none"
  />
  <!-- Blue angular "Z" bracket — right -->
  <path
    d="M50 18 L54 18 L54 46 L50 46"
    stroke="#2563eb" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"
    fill="none"
  />

  <!-- Bold white "GZ" lettermark -->
  <!-- G -->
  <text
    x="11"
    y="42"
    font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif"
    font-size="22"
    font-weight="800"
    letter-spacing="-1"
    fill="#ffffff"
  >G</text>

  <!-- Z -->
  <text
    x="33"
    y="42"
    font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif"
    font-size="22"
    font-weight="800"
    letter-spacing="-1"
    fill="#2563eb"
  >Z</text>
</svg>